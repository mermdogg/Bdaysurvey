<title>Extremely Scientific Sunday Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap">
<style>
  /* Layout: one centered card at a time on a cream ground, a progress ribbon on top, big tappable chips. */
  :root {
    --bg: #fbf3e8;          /* cream */
    --card: #fffaf3;        /* lighter cream */
    --ink: #4a1f30;
    --muted: #8d6470;
    --pink-dark: #c2306a;
    --pink-dark-ink: #fffaf3;
    --pink-light: #f8d6e0;
    --pink-soft: #fcebef;
    --line: #efcdd6;
    --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  /* Always light: pink and cream regardless of the viewer's theme. */
  :root, :root[data-theme="dark"] { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    background-image: radial-gradient(circle at 10% 8%, var(--pink-light) 0 80px, transparent 81px),
                      radial-gradient(circle at 94% 26%, var(--pink-soft) 0 60px, transparent 61px),
                      radial-gradient(circle at 82% 96%, var(--pink-light) 0 90px, transparent 91px);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 1rem;
    line-height: 1.55;
    min-height: 100%;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding-block: 32px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    gap: 18px;
  }
  .brand { font-family: var(--font-display); font-weight: 700; color: var(--pink-dark); letter-spacing: .08em; text-transform: uppercase; font-size: .85rem; text-align: center; }
  .progress { height: 10px; border-radius: 99px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
  .progress > span { display: block; height: 100%; width: 0; background: repeating-linear-gradient(45deg, var(--pink-dark) 0 8px, color-mix(in srgb, var(--pink-dark) 70%, var(--card)) 8px 16px); transition: width .35s ease; }
  .card {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 28px;
    padding: 28px 22px;
    box-shadow: 0 8px 0 var(--pink-light);
    display: grid;
    gap: 16px;
  }
  .step { font-family: var(--font-display); font-size: .8rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
  h1, h2 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; }
  h1 { font-size: clamp(2rem, 7vw, 2.6rem); font-weight: 800; }
  h2 { font-size: clamp(1.4rem, 5vw, 1.7rem); font-weight: 700; }
  p { margin: 0; }
  .sub { color: var(--muted); }
  .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .chip {
    font: inherit; color: inherit; text-align: left; cursor: pointer;
    background: var(--pink-soft); border: 2px solid var(--line); border-radius: 18px;
    padding: 12px 14px; display: flex; gap: 10px; align-items: center;
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .chip:hover { transform: translateY(-2px); border-color: var(--pink-dark); }
  .chip:focus-visible, .btn:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--pink-dark); outline-offset: 2px; }
  .chip[aria-pressed="true"] { background: var(--pink-light); border-color: var(--pink-dark); font-weight: 700; }
  .chip .ico { font-size: 1.35rem; line-height: 1; flex: none; }
  input[type="text"], textarea {
    font: inherit; color: var(--ink); background: var(--pink-soft);
    border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; width: 100%;
  }
  textarea { min-height: 96px; resize: vertical; }
  .row { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; align-items: center; }
  .row.end { justify-content: flex-end; }
  .btn {
    font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; cursor: pointer;
    border-radius: 99px; padding: 10px 22px; border: 2px solid var(--pink-dark);
    background: var(--pink-dark); color: var(--pink-dark-ink);
  }
  .btn.ghost { background: transparent; color: var(--pink-dark); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .hint { font-size: .85rem; color: var(--muted); }
  .result-badge { justify-self: center; font-size: 3.4rem; line-height: 1; }
  .result-name { text-align: center; color: var(--pink-dark); }
  .center { text-align: center; }
  .vibe-list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .vibe-list li { background: var(--pink-soft); border-radius: 12px; padding: 8px 12px; }
  .vibe-list b { font-family: var(--font-display); }
  .note { font-size: .9rem; color: var(--muted); text-align: center; }
  /* owner panel */
  .owner { border-style: dashed; }
  .resp { border-top: 2px dashed var(--line); padding-top: 14px; display: grid; gap: 6px; }
  .resp:first-of-type { border-top: 0; padding-top: 0; }
  .qa { display: grid; grid-template-columns: minmax(0, 9rem) minmax(0, 1fr); gap: 4px 12px; font-size: .92rem; }
  .qa dt { color: var(--muted); }
  .qa dd { margin: 0; }
  .ideas { display: flex; flex-wrap: wrap; gap: 6px; }
  .ideas span { background: var(--pink-light); border-radius: 99px; padding: 3px 10px; font-size: .85rem; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <div class="brand">The Extremely Scientific Sunday Test</div>
  <div class="progress" aria-hidden="true"><span id="bar"></span></div>
  <main id="app" class="card" aria-live="polite"></main>
  <section id="owner" class="card owner" hidden>
    <h2>Answers (visible only to you)</h2>
    <div id="ownerList"><p class="sub">No answers yet. Her picks and gift ideas will appear here once she finishes the quiz.</p></div>
  </section>
</div>

<script>
(() => {
  // Each option carries a private gift hint shown only in the owner panel.
  const Q = [
    { id: "name", type: "text", title: "First, what should we call you?", sub: "A nickname is fine.", placeholder: "Your name" },
    { id: "sunday", type: "one", title: "It's Sunday and you have zero plans. You're…", options: [
      ["📚", "Reading in bed until it's somehow 2pm", "book, Kindle, reading light, book subscription"],
      ["☕", "Getting an overpriced iced latte and wandering around", "local café gift card, nice cup or tumbler, tote bag, coffee subscription"],
      ["🛁", "Doing a full reset: laundry, face mask, clean sheets", "skincare set, bath robe, nice bedding, spa day voucher"],
      ["🥂", "At brunch, catching up on the group chat news in person", "brunch / restaurant voucher, going-out bag"],
      ["📺", "Rewatching your comfort show for the fifth time", "big blanket, streaming sub, cozy loungewear"],
      ["🎧", "Getting your steps in with a podcast", "nice earbuds, activewear, water bottle"],
    ]},
    { id: "scent", type: "one", title: "Which candle would you actually buy?", options: [
      ["🍦", "Anything vanilla or sweet", "gourmand candle / perfume (vanilla, caramel)"],
      ["🍋", "Fresh citrus", "fresh / citrus candle or body mist"],
      ["🌸", "Floral", "floral perfume, flowers or a flower subscription"],
      ["🪵", "Woody, like a fancy hotel lobby", "woody / amber candle, wax melts"],
      ["🌊", "Ocean breeze", "beachy body mist, travel-themed gift"],
    ]},
    { id: "bag", type: "many", title: "What's in your bag right now?", sub: "Pick all that apply.", options: [
      ["💄", "At least three lip balms", "luxury lip product set"],
      ["🎧", "Headphones", "headphones / earbuds upgrade or case"],
      ["📖", "A book you're \"currently reading\"", "book or e-reader"],
      ["🍬", "Snacks", "snack box, fancy chocolate"],
      ["💧", "Your emotional support water bottle", "nice water bottle / tumbler"],
      ["🕶️", "Sunglasses", "new sunglasses"],
      ["🔋", "A charger, because your phone is at 12%", "power bank, charging cable"],
    ]},
    { id: "treat", type: "many", title: "The payday splurge you always talk yourself out of:", sub: "Pick up to three.", max: 3, options: [
      ["🧴", "Skincare from the nice store", "premium skincare"],
      ["🌙", "A matching pajama set", "silk / satin pajama set"],
      ["💍", "A small piece of jewelry", "dainty necklace, ring or earrings"],
      ["🍳", "That kitchen gadget all over your feed", "kitchen gadget / cookware"],
      ["🪴", "A plant you'll try very hard to keep alive", "houseplant + nice pot"],
      ["✏️", "Nice stationery", "planner, journal, pens"],
      ["📱", "A tech upgrade", "tech accessory (phone, laptop, smart device)"],
      ["🎟️", "Concert tickets or a fun class", "tickets or a class (pottery, cooking, dance)"],
    ]},
    { id: "trip", type: "one", title: "Your time off just got approved. Where are you going?", options: [
      ["🏖️", "The beach", "beach towel, travel bag, getaway voucher"],
      ["🏡", "A cabin with no Wi-Fi", "cozy socks, blanket, cabin stay"],
      ["🏙️", "A city with a long list of restaurants to try", "food tour, city weekend, restaurant gift card"],
      ["🎤", "Wherever your favorite artist is on tour", "concert tickets, merch"],
      ["🥐", "Europe, mostly for the cafés", "travel journal, luggage, trip fund"],
    ]},
    { id: "metal", type: "one", title: "Gold or silver jewelry?", options: [
      ["✨", "Gold", "gold jewelry"],
      ["🪩", "Silver", "silver jewelry"],
      ["🌷", "Rose gold", "rose gold jewelry"],
      ["➖", "I don't really wear jewelry", "skip jewelry"],
    ]},
    { id: "palette", type: "one", title: "Pick your phone wallpaper colors:", options: [
      ["🩷", "Soft pinks", "pink / blush tones"],
      ["🌿", "Sage and earthy greens", "sage / earthy tones"],
      ["🤍", "Cream and neutrals", "neutral / cream tones"],
      ["🖤", "Black", "black / dark tones"],
      ["🌈", "Bright colors", "bold, colorful stuff"],
    ]},
    { id: "keep", type: "one", title: "Which would make your week?", options: [
      ["📸", "Plans: tickets, a day out, a nice dinner", "lean toward experiences"],
      ["🎁", "Something cute to keep", "lean toward physical gifts"],
      ["🧺", "Something useful you'd use every day", "lean toward useful upgrades"],
    ]},
    { id: "obsession", type: "long", title: "What's your current obsession?", sub: "A show, an album, a hobby, a snack.", placeholder: "Right now it's…" },
    { id: "tape", type: "long", title: "What's something you own that's on its last legs?", sub: "The cracked, frayed or barely-working thing you keep saying you'll replace.", placeholder: "" },
  ];

  const STYLES = [
    ["📚", "The Homebody", "Your favorite plans are the ones that get cancelled."],
    ["☕", "The Café Regular", "You have never met an iced latte you didn't like."],
    ["🛁", "The Reset Expert", "Clean sheets night is basically a holiday to you."],
    ["🥂", "The Planner", "You're the one who actually turns the group chat into plans."],
    ["📺", "The Night-In Pro", "Comfort show, snacks, phone on do not disturb."],
    ["🎧", "The Walker", "A long walk and a good podcast fix basically everything."],
  ];

  const state = { i: 0, a: {} };
  try { const s = JSON.parse(localStorage.getItem("cozy-era-draft") || "null"); if (s && typeof s.i === "number") Object.assign(state, s); } catch (e) {}
  const saveDraft = () => { try { localStorage.setItem("cozy-era-draft", JSON.stringify(state)); } catch (e) {} };

  const app = document.getElementById("app");
  const bar = document.getElementById("bar");
  const el = (tag, props = {}, kids = []) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
    }
    for (const c of [].concat(kids)) if (c) n.append(c);
    return n;
  };

  let dbP = null, userP = null;
  function caps() {
    if (!dbP) {
      const c = window.claude;
      dbP = c?.use ? c.use("db").catch(() => null) : Promise.resolve(null);
      userP = c?.use ? c.use("user").catch(() => null) : Promise.resolve(null);
    }
    return Promise.all([dbP, userP]);
  }

  function render() {
    bar.style.width = Math.min(100, (state.i / Q.length) * 100) + "%";
    app.replaceChildren();
    if (state.i === 0 && !state.started) return renderIntro();
    if (state.i >= Q.length) return renderResult();
    const q = Q[state.i];
    const val = state.a[q.id];
    app.append(el("div", { class: "step", text: `Question ${state.i + 1} of ${Q.length}` }), el("h2", { text: q.title }));
    if (q.sub) app.append(el("p", { class: "sub", text: q.sub }));

    let next;
    if (q.type === "text" || q.type === "long") {
      const input = q.type === "text"
        ? el("input", { type: "text", id: "q-" + q.id, placeholder: q.placeholder || "", maxlength: "60", "aria-label": q.title })
        : el("textarea", { id: "q-" + q.id, placeholder: q.placeholder || "", maxlength: "600", "aria-label": q.title });
      input.value = val || "";
      input.addEventListener("input", () => { state.a[q.id] = input.value; saveDraft(); });
      input.addEventListener("keydown", e => { if (e.key === "Enter" && q.type === "text") { e.preventDefault(); next.click(); } });
      app.append(input);
      setTimeout(() => input.focus(), 0);
    } else {
      const chips = el("div", { class: "chips", role: "group", "aria-label": q.title });
      q.options.forEach(([ico, label], idx) => {
        const sel = q.type === "one" ? val === idx : (val || []).includes(idx);
        chips.append(el("button", {
          class: "chip", type: "button", "aria-pressed": String(sel),
          onclick: () => {
            if (q.type === "one") { state.a[q.id] = idx; saveDraft(); state.i++; render(); return; }
            let arr = (state.a[q.id] || []).slice();
            if (arr.includes(idx)) arr = arr.filter(x => x !== idx);
            else { if (q.max && arr.length >= q.max) arr.shift(); arr.push(idx); }
            state.a[q.id] = arr; saveDraft(); render();
          },
        }, [el("span", { class: "ico", text: ico, "aria-hidden": "true" }), el("span", { text: label })]));
      });
      app.append(chips);
    }

    const back = el("button", { class: "btn ghost", type: "button", text: "Back", onclick: () => { if (state.i === 0) state.started = false; else state.i--; saveDraft(); render(); } });
    next = el("button", { class: "btn", type: "button", text: state.i === Q.length - 1 ? "See my result" : "Next", onclick: () => { state.i++; saveDraft(); render(); } });
    if (q.type === "one" && val === undefined) next.disabled = true;
    if (q.type === "many" && !(val || []).length) next.disabled = true;
    app.append(el("div", { class: "row" }, [back, q.type === "one" && val === undefined ? el("span", { class: "hint", text: "Pick one to continue" }) : next]));
  }

  function renderIntro() {
    app.append(
      el("div", { class: "result-badge", text: "🧸", "aria-hidden": "true" }),
      el("h1", { class: "center", text: "The Extremely Scientific Sunday Test" }),
      el("p", { class: "sub center", text: "Ten quick questions, about two minutes. Results are official and not peer reviewed." }),
      el("div", { class: "row end" }, [
        el("button", { class: "btn", type: "button", text: "Start", onclick: () => { state.started = true; saveDraft(); render(); } }),
      ]),
    );
  }

  function pick(q, idx) { return q.options[idx]; }
  function summaryLines() {
    const lines = [];
    for (const q of Q) {
      const v = state.a[q.id];
      if (q.id === "name" || v === undefined || v === "" || (Array.isArray(v) && !v.length)) continue;
      if (q.type === "one") lines.push([q.title, pick(q, v)[1]]);
      else if (q.type === "many") lines.push([q.title, v.map(i => pick(q, i)[1]).join(", ")]);
      else lines.push([q.title, v]);
    }
    return lines;
  }

  function renderResult() {
    const [badge, style, blurb] = STYLES[state.a.sunday ?? 0];
    const name = (state.a.name || "").trim();
    const scent = state.a.scent !== undefined ? Q[2].options[state.a.scent][1].toLowerCase() : "";
    const color = state.a.palette !== undefined ? Q[7].options[state.a.palette][1].toLowerCase() : "";
    const trip = state.a.trip !== undefined ? Q[5].options[state.a.trip][1].toLowerCase() : "";

    const card = [
      `${name ? name + "'s" : "My"} official Sunday type: ${style}`,
      blurb,
      scent && `Scent: ${scent}`,
      color && `Colors: ${color}`,
      trip && `Dream weekend: ${trip}`,
    ].filter(Boolean).join("\n");

    const list = el("ul", { class: "vibe-list" }, [
      scent && el("li", {}, [el("b", { text: "Scent: " }), scent]),
      color && el("li", {}, [el("b", { text: "Colors: " }), color]),
      trip && el("li", {}, [el("b", { text: "Dream weekend: " }), trip]),
    ]);
    const copyBtn = el("button", { class: "btn", type: "button", text: "Copy result", onclick: async () => {
      try { await navigator.clipboard.writeText(card); copyBtn.textContent = "Copied"; }
      catch (e) { const r = document.createRange(); r.selectNodeContents(list); const s = getSelection(); s.removeAllRanges(); s.addRange(r); copyBtn.textContent = "Selected, press copy"; }
    }});
    app.append(
      el("div", { class: "step", text: "Your result" }),
      el("div", { class: "result-badge", text: badge, "aria-hidden": "true" }),
      el("h1", { class: "result-name", text: style }),
      el("p", { class: "sub center", text: blurb }),
      list,
      el("p", { class: "note", text: "Send your result to whoever shared this quiz with you." }),
      el("div", { class: "row" }, [
        el("button", { class: "btn ghost", type: "button", text: "Retake", onclick: () => { state.i = 0; state.started = false; state.a = {}; state.saved = false; saveDraft(); render(); } }),
        copyBtn,
      ]),
    );
    bar.style.width = "100%";
    submit();
  }

  async function submit() {
    if (state.saved) return;
    const [db, user] = await caps();
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const payload = { answers: state.a, lines: summaryLines(), name: (state.a.name || "").trim(), submittedAt: new Date().toISOString() };
    try { await db.doc("answers/" + uid).set(payload); state.saved = true; saveDraft(); } catch (e) { /* the copied result is the fallback */ }
  }

  function ideasFor(a) {
    const out = [];
    for (const q of Q) {
      const v = a[q.id];
      if (q.type === "one" && typeof v === "number" && q.options[v]) out.push(q.options[v][2]);
      if (q.type === "many" && Array.isArray(v)) v.forEach(i => q.options[i] && out.push(q.options[i][2]));
    }
    return out.filter(x => x !== "skip jewelry");
  }

  async function ownerPanel() {
    const [db, user] = await caps();
    if (!db || !user || !(await user.isOwner())) return;
    const sec = document.getElementById("owner");
    const box = document.getElementById("ownerList");
    sec.hidden = false;
    db.collection("answers").onSnapshot(snap => {
      if (!snap.docs.length) return;
      box.replaceChildren();
      snap.docs.forEach(d => {
        const r = d.data() || {};
        const a = r.answers || {};
        const dl = el("dl", { class: "qa" });
        (Array.isArray(r.lines) ? r.lines : []).forEach(([q, ans]) => dl.append(el("dt", { text: String(q) }), el("dd", { text: String(ans) })));
        const ideas = el("div", { class: "ideas" }, ideasFor(a).map(t => el("span", { text: t })));
        const when = r.submittedAt ? new Date(r.submittedAt).toLocaleString() : "";
        box.append(el("div", { class: "resp" }, [
          el("h2", { text: (r.name || "Someone") }),
          el("p", { class: "hint", text: when ? "Answered " + when : "" }),
          el("p", { class: "step", text: "Gift ideas from her picks" }), ideas,
          el("p", { class: "step", text: "All answers" }), dl,
        ]));
      });
    }, () => {});
  }

  render();
  ownerPanel();
})();
</script>
